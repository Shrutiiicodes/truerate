name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11", cache: pip}
      - run: pip install -r requirements-dev.txt
      - run: python run_all.py          # regenerates everything from fixed seeds (~70 s)
      - run: python -m pytest -q tests  # incl. headline-number regression and reference cross-check
